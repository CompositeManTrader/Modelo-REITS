notes_adversarial: >
  VEREDICTO DEL ADVERSARIO (16-oct-2026): SOBREVIVE-DEGRADADA. Mejor argumento en contra: de sus
  tres patas fiscales, una está en texto primario y dos dependen de supuestos. (1) REFIPRE: el Art.
  176 LISR (reforma DOF 09-12-2019; texto revisado en mley.mx, pendiente de cotejo con la Cámara de
  Diputados) dice que el capítulo solo será aplicable cuando el contribuyente ejerza el control
  efectivo (> 50%), pero también que se presume, salvo prueba en contrario, que lo tiene: la carga
  de la prueba es del contribuyente cada año, y no está verificado si la obligación informativa del
  Art. 178 aplica sin control; si el SAT lo trata como REFIPRE, la ventaja pasa a -58 pb. (2) Art.
  129 para IUSI: el Criterio 37/ISR/N no menciona ETFs; XRES no cotiza en la BMV y su ganancia iría
  al Art. 120. (3) El 15% de retención dentro del fondo se infiere de la diferencia contra el
  índice, no de un informe auditado; en XRES es contractual (swap con Morgan Stanley como
  contraparte de ~99%). Aritmética de la propia card: IUSI, el vehículo realista (físico, listado en
  la BMV como IUSIN MM), da +21 a +25 pb sin vender, más 0 a +8 por el impuesto sucesorio: ~+33 como
  máximo, debajo de +50. Solo XRES sin vender nunca llega (+57 a +59), y liquidando al final cae a
  -38 a -53: su ventaja no solo desaparece, se invierte. La composición domina la varianza: XRES
  tiene 31 emisoras del sector inmobiliario del S&P 500 con tope de 19% a 20%, IUSI filtra yield >=
  2% (la card estima ~1 punto al año de costo en 2016-2020), contra unos 120 REITs en SCHH.
  Operabilidad: la clase IUSI nació el 25-jul-2025 con 19 a 23 M USD (riesgo de cierre y venta
  forzada gravada), exige un broker con acceso a Euronext o LSE para residentes en México, y con 800
  MXN al mes el umbral de 60 mil USD deja todo en SCHH por años. Por qué resiste: no es una
  anomalía, así que no hay crowding ni decaimiento post-publicación; el protocolo de 1999 del
  tratado EE. UU.-Irlanda, el Art. 142 fr. V y la cláusula de control del Art. 176 están en texto
  primario; la exclusión del impuesto sucesorio de EE. UU. es real (IRS 2026) y vale más de lo que
  la TIR captura; son solo 4 combinaciones y la precondición del contador es su kill 1. Si en México
  el heredero conserva el costo del autor de la sucesión (inferido, por confirmar con contador),
  nunca vender puede extenderse a la herencia.

priorizacion:
  fecha: "2026-10-16"
  rango: "1 de 3"
  puntaje_ponderado: 3.95
  pesos: "mecanismo 0.25, ventaja estructural 0.15, evidencia 0.15, edge neto 0.15, crowding 0.10, datos 0.10, simplicidad 0.10"
  rubrica:
    mecanismo:
      puntaje: 4
      peso: 0.25
      motivo: >
        Cuña fiscal determinista: 44% sobre lo que SCHH reparte contra 15% retenido dentro
        del fondo, más diferimiento indefinido para quien nunca vende. Las tres patas están
        en texto primario (Convención EE. UU.-Irlanda de 1999, Art. 10(4); LISR Art. 142 fr.
        V; cláusula de control del Art. 176). No es 5 porque el Art. 176 presume el control
        salvo prueba en contrario y el Art. 129 para un ETF UCITS no está confirmado.
    ventaja_estructural:
      puntaje: 5
      peso: 0.15
      motivo: >
        Asiento fiscal de la persona física mexicana sin control del fondo: no es una
        anomalía de precio, no tiene contraparte de mercado y el uso no lo agota. Es el tipo
        de edge de la familia 6 que la literatura en inglés no cubre.
    evidencia:
      puntaje: 3
      peso: 0.15
      motivo: >
        Textos legales verificados (tratado de 1999; Arts. 5, 129, 142 y 176 LISR). La
        huella de la retención de 15% se infiere de dos fondos independientes: IDUP le ganó
        a su índice Net of Tax cada año de 2016 a 2025 por 26-54 pb pese a 40 pb de TER, y
        XRES ~+35 pb al año sobre su índice neto en 10 años. Faltan el informe anual
        auditado y la opinión escrita de un contador.
    edge_neto_tras_costos:
      puntaje: 3
      peso: 0.15
      motivo: >
        Aritmética determinista del investigador, re-corrida por el priorizador (7% de
        retorno total, 10 a 20 años): IUSI +21 a +25 pb sin vender (+6 a +11 liquidando al
        10%), más 0 a +8 de valor esperado del impuesto sucesorio; XRES +57 a +59 sin
        vender, +39 a +44 liquidando al 10% y -38 a -53 liquidando con el Art. 120; si el
        SAT aplicara REFIPRE, -58 a -60. La composición distinta del índice mueve el
        resultado realizado más que la cuña: con 2 a 3 puntos al año de error de
        seguimiento, del orden de +/-50 a 75 pb de ruido en 15 años (estimado). La vía SIC
        para IUSI cuesta ~3 pb al año de comisión.
    crowding:
      puntaje: 5
      peso: 0.1
      motivo: >
        No hay precio que arbitrar. El riesgo es de reforma (LISR, RMF, tratado) o de cierre
        de la clase de acumulación, no de decaimiento post-publicación.
    datos:
      puntaje: 3
      peso: 0.1
      motivo: >
        IUSI existe desde el 25-jul-2025: hay que reconstruirlo con la clase de distribución
        IDUP/IUSP (mismo fondo, desde 2006), y XRES solo tiene historia desde 2016. Lo
        crítico no son los datos sino la confirmación legal y el acceso: broker con Euronext
        o LSE, o casa de bolsa con el SIC (IUSIN MM).
    simplicidad:
      puntaje: 5
      peso: 0.1
      motivo: >
        Dos parámetros y 4 combinaciones; no se estima nada.
  marcada_para_escrutinio: false
  auditoria_del_adversario: >
    Objeciones concretas y verificables: texto del Art. 176 con la presunción de control,
    Criterio 37/ISR/N sin mención de ETFs, swap de XRES con Morgan Stanley como contraparte,
    clase IUSI nacida en jul-2025 con 19 a 23 M USD. Re-corrí la aritmética del investigador
    (f6_scripts/aritmetica.py, supuestos fijos, sin datos de mercado) y cuadra con lo que cita
