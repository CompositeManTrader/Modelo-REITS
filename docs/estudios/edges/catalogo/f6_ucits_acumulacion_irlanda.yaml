    dividendos de SCHH, que son el fenómeno y no el retorno de una regla). session_total = 184 +
    99 + 2 = 285: 2 OBSERVADOS y 283 CONCEPTUALES. (4) Ledger REITs_EEUU_capital|trimestral
    (docs/estudios/edges/research_ledger.yaml): sesión repo-historico-hasta-2026-10-16 con 39
