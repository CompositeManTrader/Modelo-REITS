name: Ingesta

# Corre diario durante las ventanas de reportes trimestrales, detecta 8-K nuevos
# por CIK, parsea la conciliación de AFFO, valida y escribe EN EL SERVIDOR.
#
# Antes escribía en un SQLite que iba y venía como artefacto entre corridas. Eso
# tenía sentido cuando la base no vivía en ningún lado: el artefacto era su única
# continuidad. Con la base en Postgres administrado dejó de tenerlo, y peor:
# habría seguido llenando un archivo que ya nadie lee, con la apariencia intacta
# de estar trabajando. Una tubería que corre y no le sirve a nadie es más cara
# que una apagada, porque además da confianza.
#
# Lo que sí se sigue guardando como artefacto es la bitácora, que es evidencia de
# la corrida y no un dato del modelo.

on:
  schedule:
    # Ventanas de reportes: las primeras tres semanas de febrero, mayo, agosto y
    # noviembre, de lunes a viernes a las 11:00 UTC (después del cierre de EDGAR
    # para presentaciones de la mañana).
    - cron: "0 11 1-21 2,5,8,11 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Emisores separados por comas (vacío = todo el universo)"
        required: false
        default: ""
      desde:
        description: "Fecha mínima de presentación (AAAA-MM-DD)"
        required: false
        default: ""

# Los dos flujos que ESCRIBEN en la base comparten grupo. Las escrituras son
# idempotentes, pero `purgar_hechos_derivados` borra antes de reescribir, y dos
# corridas encimadas podrían dejar a la pantalla sin esos renglones el rato que
# dure la otra. No es hipotético: la purga existe justo porque el catálogo cambia.
concurrency:
  group: escribe-en-la-base
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Sin esto la ingesta escribiría en el archivo local del runner, que se
      # borra al apagarse, y el trabajo terminaría en verde.
      REIT_DB: ${{ secrets.REIT_DB }}
      # La SEC exige un User-Agent identificable con correo de contacto.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar los secretos
        # Se dice de los tres cuál llegó, aunque solo dos sean fatales. Un mensaje
        # que solo nombra al que falta no distingue «lo puse en la pestaña
        # equivocada» de «le erré al nombre», y son arreglos distintos. Nunca se
        # imprime el valor: este repositorio es público y los registros también.
        run: |
          echo "Secretos que llegaron a este trabajo:"
          for nombre in REIT_DB SEC_USER_AGENT BANXICO_TOKEN; do
            if [ -n "${!nombre}" ]; then
              echo "  presente  $nombre"
            else
              echo "  VACÍO     $nombre"
            fi
          done
          echo
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Falta el secreto SEC_USER_AGENT. La SEC exige un User-Agent"
            echo "::error::identificable con correo de contacto; sin él, bloquea las solicitudes."
            exit 1
          fi
          # Un REIT_DB vacío no es lo mismo que ausente: `${{ secrets.REIT_DB }}`
          # define la variable como cadena vacía cuando el secreto no existe, y el
          # código entonces cae calladamente al archivo local del runner. La
          # ingesta correría cuarenta minutos, escribiría en un archivo que se
          # borra al apagarse, y terminaría EN VERDE.
          case "$REIT_DB" in
            postgres://*|postgresql://*|postgresql+*) ;;
            *)
              echo "::error::REIT_DB no apunta a un Postgres. Esto escribiría en un"
              echo "::error::archivo del runner que se borra al terminar, y el trabajo"
              echo "::error::saldría en verde sin haber dejado nada en el servidor."
              echo "Va en Settings → Secrets and variables → Actions → Repository secrets."
              exit 1
              ;;
          esac
          echo "REIT_DB apunta a un servidor Postgres."

      - name: Ingesta
        run: |
          python scripts/ingesta.py \
            ${{ github.event.inputs.tickers && format('--tickers {0}', github.event.inputs.tickers) || '' }} \
            ${{ github.event.inputs.desde && format('--desde {0}', github.event.inputs.desde) || '' }} \
            | tee ingesta.log

      - name: Fallar si hay registros sospechosos sin revisar
        # Un registro sospechoso no tumba la corrida — el dato queda guardado y
        # marcado — pero sí tiene que ser visible. Si el parser empieza a fallar
        # en silencio, este paso lo saca a la luz.
        run: |
          if grep -q "SOSPECHOSOS" ingesta.log; then
            echo "::warning::La ingesta dejó registros marcados sospechosos. Revísalos"
            echo "::warning::en la página de Valuación antes de usar los datos."
          fi

      - name: Qué quedó en el servidor
        # Sin esto el trabajo diría «terminé» y nadie sabría si dejó algo. Cuando
        # la base está en otro lado, el conteo de filas es el único reporte que
        # vale, y una tabla en cero es la diferencia entre «ya está» y «está a
        # medias» — distinción que no se nota hasta que la pantalla sale vacía.
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from src.datos.repositorio import Repositorio

          print("### Filas en el servidor\n")
          print("| tabla | filas |")
          print("|---|---:|")
          for tabla, n in Repositorio().conteos().items():
              print(f"| {tabla} | {n:,} |")
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Exigir que la base siga utilizable
        run: |
          python - <<'PY'
          import sys

          from src.datos.repositorio import Repositorio

          conteos = Repositorio().conteos()
          vacias = [t for t in ("hechos", "precios", "tasas") if not conteos.get(t)]
          if vacias:
              print(f"::error::Quedaron vacías: {', '.join(vacias)}")
              sys.exit(1)
          print(f"Base utilizable: {conteos['hechos']:,} hechos, "
                f"{conteos['precios']:,} precios, {conteos['tasas']:,} tasas.")
          PY

      - name: Guardar la bitácora
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitacora-ingesta
          path: ingesta.log
          retention-days: 30
